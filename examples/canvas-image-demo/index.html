<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry canvas image</title>
  <script src="wasm_exec.js"></script>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    #stage { display: block; background: #f6f7f8; }
    .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #state { font-family: monospace; font-size: 12px; color: #6b7280; word-break: break-all; max-height: 6em; overflow: auto; }
  </style>
</head>
<body>
  <h1>Canvas image</h1>
  <p>Switch to edit mode, then use the toolbar above the picture: <b>Move</b> (drag left/right, snaps to 5px), <b>Clip</b> (drag an edge handle), <b>Alpha</b> (drag the slider) and <b>Wrap</b> (text flows around the picture).</p>
  <p><button id="mode">Mode: view (click to switch)</button></p>
  <canvas id="stage" width="900" height="600"></canvas>
  <input id="input" class="hidden-input" type="text" autocomplete="off">
  <p id="state">(pending)</p>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => go.run(r.instance));
  </script>
</body>
</html>
