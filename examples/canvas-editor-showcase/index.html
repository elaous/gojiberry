<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry editor showcase</title>
  <!-- Operator setting: the least strict gate before exporting a document with accessibility errors that a
       person may choose in the Check tab. Set content to "warn" or "block" (with "block" an export with
       errors cannot be allowed anyway); empty leaves the choice to the person. See docs/accessibility-testing.md. -->
  <meta name="gojiberry-min-export-gate" content="">
  <script>
    // The page may be served at .../d/{doc}: assets are relative to the app, not to that path.
    document.write('<base href="' + location.pathname.replace(/(^|\/)[df]\/[^\/]*\/?$/, '$1') .replace(/[^\/]*$/, '') + '">');
  </script>
  <script src="wasm_exec.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    body { background: var(--gj-bg); color: var(--gj-text); }
    #app { height: calc(100% - 3.2em); }
    .gj-keybindings-button.gj-symbolpicker-chip-on { background: var(--gj-accent); border-color: var(--gj-accent); color: var(--gj-accent-contrast); }
    #app { overflow: hidden; }
    #stage { display: block; background: #f6f7f8; }
    .hidden-input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; }
    #state { font-family: monospace; font-size: 11px; color: #6b7280; word-break: break-all; max-height: 3em; overflow: hidden; margin: 0.2em 0.9em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <canvas id="stage" width="920" height="640"></canvas>
  <input id="input" class="hidden-input" type="text" autocomplete="off">
  <p id="state">(pending)</p>
  <script>
    // Crash codes (roadmap 57, step 7): only if the person agreed to them in the Privacy tab, a crash is kept as
    // two fixed words (the part of the page, the kind) for the page to count at the next visit; a crash that ends
    // the program cannot count itself. No message, stack, file name or address is read into it.
    function gjCrash(part, kind) {
      try {
        if (localStorage.getItem("showcase:crash") !== "on") return;
        const k = "showcase:crash-pending";
        const v = JSON.parse(localStorage.getItem(k) || "[]");
        if (v.length < 20) v.push(part + "_" + kind);
        localStorage.setItem(k, JSON.stringify(v));
      } catch (e) {}
    }
    function gjPart(src) {
      src = String(src || "");
      if (/files(-worker)?\.(wasm|js)/.test(src)) return "files";
      if (/sw\.js/.test(src)) return "worker";
      if (/main\.wasm|wasm_exec/.test(src)) return "editor";
      return "page";
    }
    addEventListener("error", (e) => gjCrash(gjPart(e.filename), e.error && e.error.name === "RuntimeError" ? "trap" : "error"));
    addEventListener("unhandledrejection", (e) => gjCrash("page", e.reason && e.reason.name === "RuntimeError" ? "trap" : "rejection"));
    const go = new Go();
    const goExit = go.exit; // a Go panic ends the program with a code other than 0
    go.exit = (code) => { if (code !== 0) gjCrash("editor", "panic"); goExit(code); };
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => go.run(r.instance)).catch((err) => gjCrash("editor", err && err.name === "RuntimeError" ? "trap" : "error"));
    // Repeat visits start from the browser's copy of the app (sw.js is written by cmd/wasmdist, which a
    // plain development server does not have: the registration then fails and nothing changes).
    // ?nosw leaves it out.
    if ("serviceWorker" in navigator && !/[?&]nosw\b/.test(location.search)) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
