<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry editor showcase</title>
  <!-- Operator setting: the least strict gate before exporting a document with accessibility errors that a
       person may choose in the Check tab. Set content to "warn" or "block" (with "block" an export with
       errors cannot be allowed anyway); empty leaves the choice to the person. See docs/accessibility-testing.md. -->
  <meta name="gojiberry-min-export-gate" content="">
  <script>
    // The page may be served at .../d/{doc}: assets are relative to the app, not to that path.
    document.write('<base href="' + location.pathname.replace(/(^|\/)[df]\/[^\/]*\/?$/, '$1') .replace(/[^\/]*$/, '') + '">');
  </script>
  <script src="wasm_exec.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    body { background: var(--gj-bg); color: var(--gj-text); }
    #app { height: calc(100% - 3.2em); }
    .gj-keybindings-button.gj-symbolpicker-chip-on { background: var(--gj-accent); border-color: var(--gj-accent); color: var(--gj-accent-contrast); }
    #app { overflow: hidden; }
    #stage { display: block; background: #f6f7f8; }
    .hidden-input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; }
    #state { font-family: monospace; font-size: 11px; color: #6b7280; word-break: break-all; max-height: 3em; overflow: hidden; margin: 0.2em 0.9em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <canvas id="stage" width="920" height="640"></canvas>
  <input id="input" class="hidden-input" type="text" autocomplete="off">
  <p id="state">(pending)</p>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => go.run(r.instance));
    // Repeat visits start from the browser's copy of the app (sw.js is written by cmd/wasmdist, which a
    // plain development server does not have: the registration then fails and nothing changes).
    // ?nosw leaves it out.
    if ("serviceWorker" in navigator && !/[?&]nosw\b/.test(location.search)) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
