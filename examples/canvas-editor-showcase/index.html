<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry editor showcase</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="fontselector.css">
  <link rel="stylesheet" href="styleeditor.css">
  <script src="wasm_exec.js"></script>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    .layout { display: flex; gap: 1em; align-items: flex-start; }
    .toolbar { width: 340px; flex: none; }
    #stage { display: block; background: #f6f7f8; }
    .hidden-input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; }
    .command { font-size: 12px; } kbd { background: #eceef1; border-radius: 3px; padding: 0 4px; font-size: 11px; }
    #state { font-family: monospace; font-size: 12px; color: #6b7280; word-break: break-all; max-height: 5em; overflow: auto; }
  </style>
</head>
<body>
  <h1>Editor showcase</h1>
  <div class="layout">
    <div id="app"></div>
    <div>
      <canvas id="stage" width="920" height="640"></canvas>
      <input id="input" class="hidden-input" type="text" autocomplete="off">
    </div>
  </div>
  <p id="state">(pending)</p>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => go.run(r.instance));
  </script>
</body>
</html>
