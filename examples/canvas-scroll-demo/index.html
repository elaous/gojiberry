<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry canvas scroll view</title>
  <script src="wasm_exec.js"></script>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    #controls { display: flex; gap: 1em; align-items: center; margin-bottom: 0.6em; }
    #stage { display: block; }
    .hidden-input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; }
    #state { font-family: monospace; font-size: 12px; color: #6b7280; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Canvas scroll view</h1>
  <p>A 420&times;300 viewport onto a table far larger than that. Scroll with the wheel or drag a scrollbar; lock either axis with the checkboxes. In edit mode the table inside is fully interactive.</p>
  <div id="controls">
    <button id="mode">Mode: view (click to switch)</button>
    <label><input id="lockv" type="checkbox"> Lock vertical scroll</label>
    <label><input id="lockh" type="checkbox"> Lock horizontal scroll</label>
  </div>
  <canvas id="stage" width="480" height="340"></canvas>
  <input id="input" class="hidden-input" type="text" autocomplete="off">
  <p id="state">(pending)</p>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => go.run(r.instance));
  </script>
</body>
</html>
