<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry canvas table</title>
  <script src="wasm_exec.js"></script>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    #table { display: block; }
    .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #state { font-family: monospace; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Canvas table</h1>
  <p>Starts in view mode (read-only); switch to edit mode, then click a cell to edit. Tab / Shift+Tab / Enter / arrows move around; hover the table and click the
  <b>+</b> on the right edge or bottom to add a column or row.</p>
  <p><button id="mode">Mode: view (click to switch)</button></p>
  <canvas id="table" width="700" height="300"></canvas>
  <input id="input" class="hidden-input" type="text" autocomplete="off">
  <p id="state"></p>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => go.run(r.instance));
  </script>
</body>
</html>
