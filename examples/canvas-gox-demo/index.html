<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gojiberry canvas/gox</title>
  <script src="wasm_exec.js"></script>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    #controls { display: flex; flex-wrap: wrap; gap: 0.8em; align-items: center; margin-bottom: 0.6em; }
    #controls input[type=number] { width: 4em; }
    #source { width: 100%; height: 5em; font-family: monospace; }
    #stage { display: block; background: #f6f7f8; margin-top: 0.6em; }
    .hidden-input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; }
    #state { font-family: monospace; font-size: 12px; color: #6b7280; word-break: break-all; max-height: 6em; overflow: auto; }
  </style>
</head>
<body>
  <h1>A canvas from a gox tree</h1>
  <p>The page below is <code>app.gox</code>: <code>&lt;canvas.Canvas&gt;&lt;canvas.TextFlow pages={func(page gox.Node, n int) gox.Node {...}}/&gt;&lt;/canvas.Canvas&gt;</code>.</p>
  <div id="controls">
    <button id="mode">Mode: view (click to switch)</button>
    <label>Pages <input id="pages" type="number" value="3" min="1" max="8"></label>
  </div>
  <textarea id="source"></textarea>
  <canvas id="stage" width="900" height="560"></canvas>
  <input id="input" class="hidden-input" type="text" autocomplete="off">
  <p id="state">(pending)</p>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((r) => go.run(r.instance));
  </script>
</body>
</html>
