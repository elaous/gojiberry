# Free-tier CI: plain ubuntu-latest GitHub-hosted runners only -- no
# macOS/Windows runners, no larger paid runners, no self-hosted fleet.
# Mirrors OnDesign's own .github/workflows/ci.yml in spirit (see that
# file's own doc comment for the fuller reasoning), but single-repo:
# gojiberry has no dependency on OnDesign -- the relationship only runs
# the other way (OnDesign's go.mod replaces this module with a sibling
# checkout), so there's no second private repo to check out here.
#
# Every step below just runs the Makefile target of the same name --
# see the root Makefile and README.md's own "Development" section for
# what each one actually does. Kept as separate named steps (rather
# than one `make check` step) so a failure's log is scoped to exactly
# the check that failed, not buried in a longer combined run.
name: CI

# Manual, plus the nightly browser run: run it from the Actions tab ("Run workflow", pick a branch). The checks run
# locally before code is pushed (targeted tests for the change) and the full suite runs once
# every ten merged PRs; see docs/testing-workflow.md. To turn the automatic runs back on,
# restore `push:` and `pull_request:` under `on:`.
on:
  # nightly: the whole browser suite of the showcase (the e2e job), on the default branch; see docs/testing-workflow.md for the cost
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "What to run"
        type: choice
        default: all
        options:
          - all
          - fast-checks
          - a11y
          - e2e
          - mailpit
          - grammar
          - postgres
          - mongodb

jobs:
  fast-checks:
    if: ${{ inputs.run == 'all' || inputs.run == 'fast-checks' }}
    name: Build, vet, gofmt, test, lint (native + wasm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make generate
        run: make generate

      - name: make fmt-check
        run: make fmt-check

      - name: make vet
        run: make vet

      # The deploy recipes of docs/deploy.md are run against the real servers (cmd/wasmdist nginx_test.go and
      # caddy_test.go): they fail, rather than skip, when the server is missing.
      - name: Install nginx, brotli and Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx brotli
          sudo systemctl stop nginx || true
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.8.4
          echo "GOJIBERRY_CADDY=$(go env GOPATH)/bin/caddy" >> "$GITHUB_ENV"

      - name: make test
        run: make test
        env:
          GOJIBERRY_REQUIRE_NGINX: "1"
          GOJIBERRY_REQUIRE_CADDY: "1"

      - name: make wasm-vet
        run: make wasm-vet

      - name: make lint
        run: make lint

      - name: make wasm-lint
        run: make wasm-lint

      - name: make lint-modules
        run: make lint-modules

      - name: make modules
        run: make modules

      # The size gate: the showcase wasm against the budget in docs/wasm-budget.txt (roadmap 82).
      - name: make wasm-size
        run: make wasm-size

      # Computes the coverage profile and rewrites README.md's coverage badge line in this checkout
      # (a static img.shields.io URL, see gen-coverage-badge.sh). The run is manual, so nothing is
      # committed from here: the badge in README.md is updated by hand at each full run
      # (`make coverage-badge`, then commit README.md; docs/testing-workflow.md). This step still
      # proves that the generator works.
      - name: make coverage-badge
        run: make coverage-badge

  # The accessibility gate: axe-core over the page in every state, and the keyboard and reading-copy
  # tests, in the runner's Chrome (ubuntu-latest has google-chrome). It fails, rather than skips, if no
  # browser is found. Also runnable on this machine: `make a11y-test`, `make ci-local STEPS=a11y-test`.
  a11y:
    if: ${{ inputs.run == 'all' || inputs.run == 'a11y' }}
    name: Accessibility gate (axe-core and keyboard tests in Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Which browser
        run: |
          for b in chromium chromium-browser google-chrome google-chrome-stable; do
            if command -v "$b" >/dev/null; then echo "using $b"; "$b" --version; exit 0; fi
          done
          echo "no Chrome or Chromium on this runner"
          exit 1

      - name: make a11y-test
        run: make a11y-test

  e2e:
    if: ${{ github.event_name == 'schedule' || inputs.run == 'all' || inputs.run == 'e2e' }}
    name: The whole browser suite of the showcase (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Which browser
        run: |
          for b in chromium chromium-browser google-chrome google-chrome-stable; do
            if command -v "$b" >/dev/null; then echo "using $b"; "$b" --version; exit 0; fi
          done
          echo "no Chrome or Chromium on this runner"
          exit 1

      - name: make e2e-test
        run: make e2e-test

  grammar-test:
    name: vscode-xango grammar suite
    runs-on: ubuntu-latest
    # grammar-test-setup downloads VS Code's own Go/HTML/CSS/SQL/JSON
    # grammars on every run (not redistributed here, no cache key
    # established yet) -- gated to the events that actually need it,
    # the same way OnDesign's own e2e job is, to keep this off every
    # incremental branch push and save free-tier minutes.
    if: ${{ inputs.run == 'all' || inputs.run == 'grammar' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make generate
        run: make generate

      - name: make grammar-test-setup
        run: make grammar-test-setup

      - name: make grammar-test
        run: make grammar-test

  # The SMTP sender is tested against real Mailpit servers: the axllent/mailpit Docker image, started
  # twice by .github/scripts/mailpit-test.sh on the runner's Docker (STARTTLS with sign-in, and plain on
  # loopback). The script fails on a skipped test. MAILPIT_IMAGE can pin another tag of the image.
  mail-mailpit:
    if: ${{ inputs.run == 'all' || inputs.run == 'mailpit' }}
    name: mail tests against Mailpit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make mail-test
        run: make mail-test

  # The canvas-app dev server tests need a real PostgreSQL and skip without one (a skip prints "ok" and
  # hid a stale assertion once). A service container is cheap, so run them here and fail on any skip.
  canvas-app-postgres:
    if: ${{ inputs.run == 'all' || inputs.run == 'postgres' }}
    name: canvas-app tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas
          POSTGRES_DB: canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://canvas:canvas@127.0.0.1:5432/canvas?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply the migrations
        run: psql "$TEST_DATABASE_URL" -f examples/canvas-app/canvas/migrations/1_create_documents.up.sql

      - name: Run the tests and fail on a skip
        working-directory: examples/canvas-app
        run: |
          go test -count=1 -v ./... | tee test.log
          if grep -q -- '--- SKIP' test.log; then
            echo "a Postgres-backed test was skipped"
            exit 1
          fi

  # The MongoDB backend tests need a real MongoDB and skip without one (a skip prints "ok"). Run them against a
  # service container and fail on any skip.
  mongo-backend:
    if: ${{ inputs.run == 'all' || inputs.run == 'mongodb' }}
    name: docstore MongoDB backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run the tests and fail on a skip
        working-directory: docstore/backends
        run: |
          go test -count=1 -race -v ./mongo/ | tee test.log
          if grep -q -- '--- SKIP' test.log; then
            echo "a MongoDB test was skipped"
            exit 1
          fi
