# Free-tier CI: plain ubuntu-latest GitHub-hosted runners only -- no
# macOS/Windows runners, no larger paid runners, no self-hosted fleet.
# Mirrors OnDesign's own .github/workflows/ci.yml in spirit (see that
# file's own doc comment for the fuller reasoning), but single-repo:
# gojiberry has no dependency on OnDesign -- the relationship only runs
# the other way (OnDesign's go.mod replaces this module with a sibling
# checkout), so there's no second private repo to check out here.
#
# Every step below just runs the Makefile target of the same name --
# see the root Makefile and README.md's own "Development" section for
# what each one actually does. Kept as separate named steps (rather
# than one `make check` step) so a failure's log is scoped to exactly
# the check that failed, not buried in a longer combined run.
name: CI

# Manual for now: run it from the Actions tab ("Run workflow", pick a branch). The checks run
# locally before code is pushed (targeted tests for the change) and the full suite runs once
# every ten merged PRs; see docs/testing-workflow.md. To turn the automatic runs back on,
# restore `push:` and `pull_request:` under `on:`.
on:
  workflow_dispatch:

jobs:
  fast-checks:
    name: Build, vet, gofmt, test, lint (native + wasm)
    runs-on: ubuntu-latest
    # contents: write only matters for the "Update coverage badge" step
    # below (git commit + push to main) -- every other step here only
    # ever reads the checkout, the same read-only default this job used
    # before that step existed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make generate
        run: make generate

      - name: make fmt-check
        run: make fmt-check

      - name: make vet
        run: make vet

      - name: make test
        run: make test

      - name: make wasm-vet
        run: make wasm-vet

      - name: make lint
        run: make lint

      - name: make wasm-lint
        run: make wasm-lint

      - name: make lint-modules
        run: make lint-modules

      - name: make modules
        run: make modules

      # The size gate: the showcase wasm against the budget in docs/wasm-budget.txt (roadmap 82).
      - name: make wasm-size
        run: make wasm-size

      # The accessibility gate: axe-core and the keyboard tests in a real browser (the runner's
      # Chrome). It fails, rather than skips, if no browser is found.
      - name: make a11y-test
        run: make a11y-test

      # Rewrites README.md's own coverage badge line (a static
      # img.shields.io URL, not a self-hosted SVG -- see
      # gen-coverage-badge.sh's own doc comment for why) from this
      # exact run's `make test` coverage profile and commits it back --
      # gated to pushes on main specifically (not PRs, not feature
      # branches) since main's own README is the only copy anyone
      # actually sees; a PR/branch build still proves the generator
      # itself works (make coverage-badge runs, just isn't committed)
      # via the exit code of this step.
      - name: make coverage-badge
        run: make coverage-badge

      - name: Commit updated coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- README.md; then
            echo "coverage badge unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "ci: update coverage badge [skip ci]"
          git push

  grammar-test:
    name: vscode-xango grammar suite
    runs-on: ubuntu-latest
    # grammar-test-setup downloads VS Code's own Go/HTML/CSS/SQL/JSON
    # grammars on every run (not redistributed here, no cache key
    # established yet) -- gated to the events that actually need it,
    # the same way OnDesign's own e2e job is, to keep this off every
    # incremental branch push and save free-tier minutes.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make generate
        run: make generate

      - name: make grammar-test-setup
        run: make grammar-test-setup

      - name: make grammar-test
        run: make grammar-test

  # The SMTP sender is tested against real Mailpit servers (the axllent/mailpit image, started by the
  # script on the runner's Docker); the script fails on a skipped test.
  mail-mailpit:
    name: mail tests against Mailpit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make mail-test
        run: make mail-test

  # The canvas-app dev server tests need a real PostgreSQL and skip without one (a skip prints "ok" and
  # hid a stale assertion once). A service container is cheap, so run them here and fail on any skip.
  canvas-app-postgres:
    name: canvas-app tests against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas
          POSTGRES_DB: canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://canvas:canvas@127.0.0.1:5432/canvas?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply the migrations
        run: psql "$TEST_DATABASE_URL" -f examples/canvas-app/canvas/migrations/1_create_documents.up.sql

      - name: Run the tests and fail on a skip
        working-directory: examples/canvas-app
        run: |
          go test -count=1 -v ./... | tee test.log
          if grep -q -- '--- SKIP' test.log; then
            echo "a Postgres-backed test was skipped"
            exit 1
          fi

  # The MongoDB backend tests need a real MongoDB and skip without one (a skip prints "ok"). Run them against a
  # service container and fail on any skip.
  mongo-backend:
    name: docstore MongoDB backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run the tests and fail on a skip
        working-directory: docstore/backends
        run: |
          go test -count=1 -race -v ./mongo/ | tee test.log
          if grep -q -- '--- SKIP' test.log; then
            echo "a MongoDB test was skipped"
            exit 1
          fi
