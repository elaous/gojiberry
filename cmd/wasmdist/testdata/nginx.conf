# nginx settings for a precompressed wasm site served from /usr/share/nginx/html (docs/deploy.md explains each line).
# Copy of nginx.conf in the OpenDocs repository; the Dockerfile there installs it as /etc/nginx/conf.d/default.conf.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Send main.wasm.gz (made by cmd/wasmdist) as it is when the browser accepts gzip, instead of
  # compressing 27 MB on every request. gzip on covers files that have no .gz beside them.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_types application/wasm application/javascript text/css;

  # The file names carry no content hash, so the browser keeps its copy but asks each time with the
  # ETag: a repeat visit is a 304 with no body. (Hash the names and mark them immutable to skip even
  # that request; see docs/deploy.md.)
  add_header Cache-Control "no-cache";

  # A wrong type for .wasm makes the browser download the whole file before compiling it, because
  # WebAssembly.instantiateStreaming refuses it.
  location ~ \.wasm$ {
    types { application/wasm wasm; }
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # A script or style that does not exist is a 404, not the page.
  location ~ \.(js|css|gz)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # An app path such as /d/report is answered with the page.
  location / {
    try_files $uri /index.html;
  }
}
